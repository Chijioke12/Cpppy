<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Physics Demolition (KaiOS / Web)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #06090F;
      color: #E2E8F0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }
    
    /* Screen canvas stage */
    .game-screen {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      height: calc(100% - 32px);
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B1120;
      overflow: hidden;
      touch-action: none;
    }

    canvas.emscripten {
      display: block;
      width: 100% !important;
      height: 100% !important;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border: 0;
      outline: none;
      touch-action: none;
    }

    /* KaiOS Hardware SoftKey Action Bar */
    .softkey-bar {
      flex: 0 0 32px;
      width: 100%;
      height: 32px;
      background: #0F172A;
      border-top: 1px solid #1E293B;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 100;
    }

    .softkey {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94A3B8;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
      text-align: center;
    }
    .softkey:active, .softkey:hover {
      background: #1E293B;
      color: #F8FAFC;
    }
    .softkey.left {
      text-align: left;
      color: #38BDF8;
      flex: 1;
    }
    .softkey.center {
      text-align: center;
      color: #FACC15;
      font-weight: 800;
      flex: 1.2;
    }
    .softkey.right {
      text-align: right;
      color: #F87171;
      flex: 1;
    }

    /* Loading overlay */
    #loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #06090F;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #1E293B;
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 12px;
      color: #94A3B8;
      font-weight: 600;
      text-align: center;
      padding: 0 16px;
    }
    .progress-bar-container {
      width: 160px;
      height: 4px;
      background: #1E293B;
      border-radius: 2px;
      margin-top: 10px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: #38BDF8;
      transition: width 0.2s;
    }
  </style>
</head>
<body>
  <div class="game-screen">
    <div id="loading-overlay">
      <div class="spinner"></div>
      <div class="status-text" id="status">Loading Physics Engine...</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <!-- KaiOS Physical & On-Screen SoftKey Bar -->
  <footer class="softkey-bar" id="softkey-bar">
    <button class="softkey left" id="lsk-btn" onclick="simulateKey(112, 'SoftLeft', 't')">SoftLeft</button>
    <button class="softkey center" id="center-btn" onclick="simulateKey(13, 'Enter', ' ')">Aim / Fire</button>
    <button class="softkey right" id="rsk-btn" onclick="simulateKey(113, 'SoftRight', 'r')">SoftRight</button>
  </footer>

  <script>
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress-bar');
    var loadingOverlay = document.getElementById('loading-overlay');
    var canvasElement = document.getElementById('canvas');

    function simulateKey(keyCode, keyName, charVal) {
      if (!canvasElement) return;
      var eventDown = new KeyboardEvent('keydown', {
        key: keyName,
        code: keyName,
        keyCode: keyCode,
        which: keyCode,
        bubbles: true
      });
      canvasElement.dispatchEvent(eventDown);
      window.dispatchEvent(eventDown);
    }

    // KaiOS Keypad Listener mapping for physical hardware
    window.addEventListener('keydown', function(e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'SoftLeft', 'SoftRight', 'Enter', 'F1', 'F2', 'Backspace', '0', '1', '2', '3', '4', '5'].includes(e.key)) {
        if (e.key === 'SoftLeft' || e.key === 'F1') {
          simulateKey(112, 'SoftLeft', 't');
          e.preventDefault();
        } else if (e.key === 'SoftRight' || e.key === 'F2' || e.key === 'Backspace') {
          simulateKey(113, 'SoftRight', 'r');
          e.preventDefault();
        }
      }
    });

    var Module = {
      preRun: [],
      postRun: [function() {
        if (loadingOverlay) {
          loadingOverlay.style.opacity = '0';
          setTimeout(function() {
            loadingOverlay.style.display = 'none';
          }, 300);
        }
      }],
      print: function(text) {
        console.log('[Wasm]: ' + text);
      },
      printErr: function(text) {
        console.error('[Wasm Error]: ' + text);
      },
      canvas: (function() {
        canvasElement.addEventListener("webglcontextlost", function(e) {
          alert('WebGL context lost. Please reload.');
          e.preventDefault();
        }, false);
        return canvasElement;
      })(),
      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) return;
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (m) {
          text = m[1];
          if (progressElement) {
            var percent = (parseInt(m[2]) / parseInt(m[4])) * 100;
            progressElement.style.width = percent + '%';
          }
        }
        if (statusElement) statusElement.innerText = text;
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left ? 'Loading... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
      }
    };

    Module.setStatus('Loading...');
    window.onerror = function(event) {
      Module.setStatus('Error loading engine');
      if (loadingOverlay) loadingOverlay.style.display = 'none';
    };
  </script>
  <script async src="index.js"></script>
</body>
</html>
